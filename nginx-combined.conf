# nginx config for the combined (all-in-one) container.
# Serves the React SPA from /usr/share/nginx/html and proxies
# /api/* to uvicorn running on 127.0.0.1:8000.

server {
    listen 80;
    server_name _;

    # 0 = no limit. Set a value (e.g. 100m) to cap upload size.
    client_max_body_size 0;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml;

    # ── Static assets — long cache ────────────────────────────────────────────
    location ~* \.(?:ico|css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API proxy → uvicorn (loopback, no DNS needed) ─────────────────────────
    location /api/ {
        proxy_pass              http://127.0.0.1:8000/api/;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      60s;
        proxy_request_buffering off;
    }

    # ── Backend health endpoint (useful for container health checks) ──────────
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
