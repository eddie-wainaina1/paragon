<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Nifty{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    body { margin:0; padding:0; background-color:#FFF7ED; font-family:'Inter',Arial,Helvetica,sans-serif; }

    /* ── Outer wrapper ── */
    .outer { background-color:#FFF7ED; padding:40px 16px; }

    /* ── Card ── */
    .card { max-width:600px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08); }

    /* ── Header ── */
    .header { background:linear-gradient(135deg,#F97316 0%,#EA580C 100%); padding:28px 32px; }
    .logo-icon-cell { padding-right:12px; vertical-align:middle; }
    .logo-icon { display:block; border-radius:8px; }
    .logo-name-cell { vertical-align:middle; }
    .nifty-logo { font-family:'Fredoka One',Arial,Helvetica,sans-serif; font-size:26px; font-weight:800; letter-spacing:0.01em; line-height:1.2; }
    .logo-brand { color:#FDE68A; }
    .logo-suffix { color:rgba(255,255,255,0.92); margin-left:6px; }
    .tagline { margin-top:5px; font-size:12px; color:rgba(255,255,255,0.65); letter-spacing:0.01em; }

    /* ── Content area ── */
    .content { padding:32px 32px 24px 32px; color:#1a1a1a; font-size:15px; line-height:1.7; }

    /* ── Footer ── */
    .footer { padding:16px 32px 28px 32px; border-top:1px solid #f0e8e0; color:#999999; font-size:12px; line-height:1.6; }
    .footer a { color:#F97316; }

    /* ── Typography ── */
    .h1 { margin:0 0 16px 0; font-size:22px; font-weight:700; color:#1a1a1a; }
    .h2 { margin:0 0 8px 0; font-size:18px; font-weight:700; color:#1a1a1a; }
    .p { margin:0 0 16px 0; color:#444444; }
    .p-secondary { margin:0 0 20px 0; color:#555555; }
    .p-meta { margin:0 0 6px 0; color:#777777; font-size:13px; }
    .p-fine { margin:0; color:#999999; font-size:12px; }
    .link { color:#F97316; }
    .link-plain { color:#F97316; font-weight:600; text-decoration:none; }

    /* ── CTA button ── */
    .btn-table { margin:28px 0; }
    .btn-wrap { background-color:#F97316; border-radius:6px; }
    .btn { display:inline-block; padding:14px 28px; color:#ffffff; font-size:15px; font-weight:700; text-decoration:none; border-radius:6px; line-height:1; }

    /* ── Fallback link ── */
    .fallback-url { margin:0 0 24px 0; word-break:break-all; font-size:13px; }

    /* ── Info box (credentials, highlighted content) ── */
    .info-box { margin:20px 0; background-color:#FFF7ED; border-radius:6px; border:1px solid #fed7aa; }
    .info-box-inner { padding:16px 20px; }
    .info-box-label { margin:0 0 8px 0; font-size:13px; color:#777777; text-transform:uppercase; letter-spacing:0.5px; }
    .info-box-value { margin:0; font-size:16px; font-weight:700; color:#1a1a1a; letter-spacing:1px; font-family:monospace; }

    /* ── Warning box ── */
    .warning-box { background-color:#FFF7ED; border:1px solid #FDDCB0; border-radius:6px; margin-bottom:24px; }
    .warning-box-inner { padding:14px 16px; font-size:14px; color:#92400E; line-height:1.6; }

    /* ── Detail table (key/value rows with header) ── */
    .detail-table { border:1px solid #f0e8e0; border-radius:6px; overflow:hidden; margin-bottom:24px; }
    .detail-table-header { padding:10px 16px; font-size:12px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:0.05em; border-bottom:1px solid #f0e8e0; background-color:#FFF7ED; }
    .detail-table-body { padding:16px; }
    .detail-label { padding:6px 0; color:#555; font-size:14px; width:120px; }
    .detail-value { padding:6px 0; color:#1a1a1a; font-size:14px; font-weight:600; }

    /* ── Change list ── */
    .change-list { border:1px solid #f0e8e0; border-radius:6px; overflow:hidden; margin-bottom:24px; }
    .change-row { border-bottom:1px solid #f0e8e0; }
    .change-cell { padding:12px 16px; font-size:14px; color:#1a1a1a; line-height:1.5; }

    /* ── Inline code ── */
    .code { background:#f5f5f5; padding:2px 6px; border-radius:3px; }
  </style>
</head>
<body>

  <table width="100%" cellpadding="0" cellspacing="0" border="0" class="outer">
    <tr>
      <td align="center">

        <table width="600" cellpadding="0" cellspacing="0" border="0" class="card">

          <!-- Header -->
          <tr>
            <td class="header">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td class="logo-icon-cell">
                    <img src="{{ frontend_url }}/apple-touch-icon.png"
                         alt="Nifty"
                         width="40" height="40"
                         class="logo-icon" />
                  </td>
                  <td class="logo-name-cell">
                    <div class="nifty-logo">
                      <span class="logo-brand">Nifty</span><span class="logo-suffix">by Paragon</span>
                    </div>
                    <div class="tagline">
                      Where schools, teachers &amp; students explore technology together
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td class="content">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="footer">
              &copy; {{ year }} Paragon Shell. All rights reserved.<br />
              You received this email because an account was created with your email address on <a href="https://paragoneschool.com">paragoneschool.com</a>.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
